name: Release Spread++

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        if: matrix.arch == 'amd64'
        run: go test ./...

      - name: Build Spread++
        env:
          CGO_ENABLED: '0'
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          go build \
            -ldflags "-X main.version=${VERSION}" \
            -o bin/spreadpp \
            ./cmd/spread

      - name: Package
        run: |
          tar -C bin -czf "spreadpp-${{ matrix.arch }}.tar.gz" spreadpp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spreadpp-${{ matrix.arch }}
          path: spreadpp-${{ matrix.arch }}.tar.gz

  build-snap:
    name: Build snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check snap version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          SNAP_VERSION="$(awk '$1 == "version:" { print $2; exit }' snapcraft.yaml)"
          if [ "$SNAP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Snap version $SNAP_VERSION does not match release tag $RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Rename snap
        env:
          BUILT_SNAP: ${{ steps.snapcraft.outputs.snap }}
        run: mv "${BUILT_SNAP}" "spreadpp-${{ matrix.arch }}.snap"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spreadpp-snap-${{ matrix.arch }}
          path: spreadpp-${{ matrix.arch }}.snap

  release:
    name: Publish release assets
    needs: [build, build-snap]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum \
            spreadpp-amd64.tar.gz \
            spreadpp-arm64.tar.gz \
            spreadpp-amd64.snap \
            spreadpp-arm64.snap \
            > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spreadpp-amd64.tar.gz
            dist/spreadpp-arm64.tar.gz
            dist/spreadpp-amd64.snap
            dist/spreadpp-arm64.snap
            dist/SHA256SUMS

      - name: Publish amd64 snap to edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/spreadpp-amd64.snap
          release: edge

      - name: Publish arm64 snap to edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/spreadpp-arm64.snap
          release: edge
