name: Test Spread++

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Spread++
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build Spread++
      env:
        CGO_ENABLED: '0'
        GOARCH: ${{ matrix.arch }}
      run: |
        SPREAD_VERSION="$(date -u +%Y.%m.%d)-dev.${GITHUB_SHA::7}"
        go build -ldflags "-X main.version=${SPREAD_VERSION}" -o bin/spreadpp ./cmd/spread
        if [ "$GOARCH" = amd64 ]; then
          test "$(./bin/spreadpp --version)" = "$SPREAD_VERSION"
        fi

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: spreadpp-${{ github.run_id }}-${{ matrix.arch }}
        path: bin/spreadpp

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run unit tests
      run: go test ./...

  integration-tests:
    name: LXD Integration Tests
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download current binary
      uses: actions/download-artifact@v4
      with:
        name: spreadpp-${{ github.run_id }}-amd64
        path: bin

    - name: Set up LXD
      run: |
        sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
        if [ ! -c /dev/kvm ]; then
          echo "LXD VM tests require /dev/kvm on this runner." >&2
          exit 1
        fi
        sudo snap install lxd --channel=5.21/stable
        sudo lxd waitready
        sudo lxd init --auto --storage-backend=dir
        sudo setfacl -m "u:$USER:rw" /var/snap/lxd/common/lxd/unix.socket
        chmod +x bin/spreadpp

    - name: Run integration tests
      run: |
        set -o pipefail
        ./bin/spreadpp -vv -logs=spread-logs lxd:tests/ 2>&1 | tee spread.log

    - name: Discard remaining workers
      if: always()
      run: |
        shopt -s nullglob
        for reuse in .spread-reuse.[0-9]*.yaml; do
          pid="${reuse#.spread-reuse.}"
          pid="${pid%.yaml}"
          ./bin/spreadpp -discard -reuse-pid="$pid" lxd:tests/
        done

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lxd-test-logs-${{ github.run_id }}
        path: |
          spread.log
          spread-logs/
