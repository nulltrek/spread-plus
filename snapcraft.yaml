name: spreadpp
title: Spread++
version: 2026.09.22
summary: Convenient full-system test (task) distribution
description: |
    Spread++ is based on Spread Plus. It provides a place to develop and test changes
    for possible inclusion in the upstream Spread project.

    New features include:
      * Featureful LXD backend, adding VM support, device mounts, resource configuration.
      * Quality of life improvements for the CLI.
      * Better support for single repo / multiple projects.

      Spread++ aims to make tests easier to understand, run, and check while keeping
      compatibility with Spread. New changes can be tested here before they are proposed upstream.

confinement: strict
grade: stable
base: core24

apps:
    spreadpp:
        command: bin/spreadpp
        plugs: [home, network, network-bind]

slots:
    spread-bin:
        interface: content
        content: spread-bin
        read:
          - $SNAP/bin

parts:
    spreadpp:
        plugin: go
        source: .
        override-build: |
          craftctl default
          go build -ldflags "-X main.version=${CRAFT_PROJECT_VERSION}" -o "$CRAFT_PART_INSTALL/bin/spread" ./cmd/spread
        organize:
          bin/spread: bin/spreadpp
        build-snaps:
          - go/1.24/stable
        stage-packages:
          - openssl
